<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve — Injection Tripwire</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d0d0d;
  --surface:   #161616;
  --border:    #2a2a2a;
  --text:      #e8e8e8;
  --muted:     #777;
  --red:       #e53935;
  --red-dim:   #3b1010;
  --yellow:    #f9a825;
  --yellow-dim:#3a2800;
  --green:     #43a047;
  --green-dim: #0d2410;
  --flash:     #1e2a14;
}

html, body { height: 100%; background: var(--bg); color: var(--text);
             font-family: 'Courier New', Courier, monospace; font-size: 13px; }

/* ── Layout ── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

header { padding: 18px 24px 14px; border-bottom: 1px solid var(--border);
         display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }

h1 { font-size: 15px; font-weight: 700; letter-spacing: .04em;
     color: var(--text); white-space: nowrap; }
h1 span { color: var(--muted); font-weight: 400; }

#counters { display: flex; gap: 10px; flex-wrap: wrap; }
.counter { font-size: 12px; padding: 3px 9px; border-radius: 3px;
           border: 1px solid var(--border); color: var(--muted); }
.counter b { color: var(--text); }
.counter.c-blocked  { border-color: var(--red);    color: var(--red); }
.counter.c-blocked b{ color: var(--red); }
.counter.c-pending  { border-color: var(--yellow);  color: var(--yellow); }
.counter.c-pending b{ color: var(--yellow); }

#stream-dot { width: 7px; height: 7px; border-radius: 50%;
              background: var(--muted); flex-shrink: 0;
              transition: background .4s; margin-left: auto; align-self: center; }
#stream-dot.live  { background: var(--green); }
#stream-dot.error { background: var(--red); }

/* ── Controls ── */
#controls { padding: 10px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.filter-btn { background: none; border: 1px solid var(--border); color: var(--muted);
              padding: 4px 12px; border-radius: 3px; cursor: pointer;
              font: inherit; font-size: 12px; transition: border-color .15s, color .15s; }
.filter-btn:hover  { border-color: #555; color: var(--text); }
.filter-btn.active { border-color: var(--text); color: var(--text); }

/* ── Table area ── */
#table-wrap { flex: 1; overflow-x: auto; padding: 0 24px 32px; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 12px; }

col.c-time    { width: 148px; }
col.c-source  { width: 110px; }
col.c-status  { width: 116px; }
col.c-detector{ width: 70px; }
col.c-risk    { width: 90px; }
col.c-summary { width: auto; }

thead th { font-size: 11px; color: var(--muted); font-weight: 600;
           letter-spacing: .06em; text-transform: uppercase;
           padding: 8px 10px 6px; border-bottom: 1px solid var(--border);
           text-align: left; white-space: nowrap; }

tbody tr { border-bottom: 1px solid var(--border);
           transition: background .18s; }
tbody tr:hover { background: #1a1a1a; }

/* flash on new/updated row */
@keyframes row-flash {
  0%   { background: var(--flash); }
  100% { background: transparent; }
}
tbody tr.flash { animation: row-flash 1.2s ease-out forwards; }

td { padding: 9px 10px; vertical-align: top; color: var(--text); word-break: break-word; }
td.ts   { color: var(--muted); white-space: nowrap; font-size: 12px; }
td.src  { color: var(--muted); }
td.det  { color: var(--muted); }
td.summ { color: #aaa; font-size: 12px; }

/* ── Badges ── */
.badge { display: inline-block; padding: 2px 7px; border-radius: 3px;
         font-size: 11px; font-weight: 700; letter-spacing: .04em;
         white-space: nowrap; }
.badge-blocked  { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red); }
.badge-pending  { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow); }
.badge-approved { background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green); }
.badge-other    { background: #1e1e1e; color: var(--muted); border: 1px solid var(--border); }

.risk-badge { display: inline-block; padding: 1px 6px; border-radius: 3px;
              font-size: 11px; font-weight: 700; }
.risk-high   { background: var(--red-dim);    color: var(--red); }
.risk-medium { background: var(--yellow-dim); color: var(--yellow); }
.risk-low    { background: #1a1a1a; color: var(--muted); }

/* ── Empty state ── */
#empty { display: none; padding: 64px 24px; text-align: center; color: var(--muted); }
#empty p { margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>SIEVE <span>/ Injection Tripwire</span></h1>
    <div id="counters">
      <div class="counter c-blocked"><b id="cnt-blocked">0</b> blocked</div>
      <div class="counter c-pending"><b id="cnt-pending">0</b> pending</div>
      <div class="counter"><b id="cnt-total">0</b> total</div>
    </div>
    <div id="stream-dot" title="Live stream disconnected"></div>
  </header>

  <div id="controls">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="blocked">Blocked</button>
    <button class="filter-btn" data-filter="pending_approval">Pending Approval</button>
  </div>

  <div id="table-wrap">
    <div id="empty">
      <div style="font-size:15px;color:#444;">— no incidents yet —</div>
      <p>Waiting for quarantine blocks and approval requests to appear.</p>
    </div>
    <table id="inc-table" style="display:none">
      <colgroup>
        <col class="c-time">
        <col class="c-source">
        <col class="c-status">
        <col class="c-detector">
        <col class="c-risk">
        <col class="c-summary">
      </colgroup>
      <thead>
        <tr>
          <th>Time</th>
          <th>Source</th>
          <th>Status</th>
          <th>Det.</th>
          <th>Risk</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody id="inc-body"></tbody>
    </table>
  </div>

</div>
<script>
(function () {
  'use strict';

  // ── State ────────────────────────────────────────────────────────────────
  const store = new Map();   // id → incident object
  let   activeFilter = 'all';

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const tbody      = document.getElementById('inc-body');
  const table      = document.getElementById('inc-table');
  const empty      = document.getElementById('empty');
  const dot        = document.getElementById('stream-dot');
  const cntBlocked = document.getElementById('cnt-blocked');
  const cntPending = document.getElementById('cnt-pending');
  const cntTotal   = document.getElementById('cnt-total');

  // ── Helpers ──────────────────────────────────────────────────────────────

  function fmtTime(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const pad = n => String(n).padStart(2, '0');
      return (
        d.getFullYear() + '-' +
        pad(d.getMonth() + 1) + '-' +
        pad(d.getDate()) + ' ' +
        pad(d.getHours()) + ':' +
        pad(d.getMinutes()) + ':' +
        pad(d.getSeconds())
      );
    } catch (_) { return iso; }
  }

  function fmtSource(s) {
    if (!s) return '—';
    return s.replace(/_/g, ' ');
  }

  function statusBadge(status) {
    if (!status) return '<span class="badge badge-other">—</span>';
    const s = String(status).toLowerCase();
    if (s === 'blocked')          return '<span class="badge badge-blocked">BLOCKED</span>';
    if (s === 'pending_approval' || s === 'pending')
                                   return '<span class="badge badge-pending">PENDING</span>';
    if (s === 'approved')          return '<span class="badge badge-approved">APPROVED</span>';
    if (s === 'rejected')          return '<span class="badge badge-other">REJECTED</span>';
    if (s === 'timed_out')         return '<span class="badge badge-other">TIMED OUT</span>';
    return '<span class="badge badge-other">' + esc(status.toUpperCase()) + '</span>';
  }

  function riskBadge(score, status) {
    if (score == null) {
      // No score: show dim badge for pending, nothing otherwise
      if (!status) return '';
      const s = String(status).toLowerCase();
      if (s === 'pending_approval' || s === 'pending')
        return '<span class="risk-badge risk-medium">pending</span>';
      return '';
    }
    const n = parseFloat(score);
    if (isNaN(n)) return '';
    if (n >= 0.5) return '<span class="risk-badge risk-high">' + n.toFixed(2) + '</span>';
    if (n > 0)    return '<span class="risk-badge risk-medium">' + n.toFixed(2) + '</span>';
    return '';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Rendering ────────────────────────────────────────────────────────────

  function rowVisible(inc) {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'blocked') return inc.status === 'blocked';
    if (activeFilter === 'pending_approval')
      return inc.status === 'pending_approval' || inc.status === 'pending';
    return true;
  }

  function buildRow(inc) {
    const tr = document.createElement('tr');
    tr.dataset.id = inc.id;
    tr.dataset.status = inc.status || '';
    tr.innerHTML =
      '<td class="ts">'   + esc(fmtTime(inc.timestamp))     + '</td>' +
      '<td class="src">'  + esc(fmtSource(inc.source))      + '</td>' +
      '<td>'              + statusBadge(inc.status)          + '</td>' +
      '<td class="det">'  + esc(inc.detector || '—')        + '</td>' +
      '<td>'              + riskBadge(inc.risk_score, inc.status) + '</td>' +
      '<td class="summ">' + esc(inc.context_summary || '')  + '</td>';
    tr.style.display = rowVisible(inc) ? '' : 'none';
    return tr;
  }

  function updateRow(inc) {
    let tr = tbody.querySelector('tr[data-id="' + CSS.escape(inc.id) + '"]');
    if (tr) {
      // Update in place
      tr.dataset.status = inc.status || '';
      tr.cells[0].textContent = fmtTime(inc.timestamp);
      tr.cells[1].textContent = fmtSource(inc.source);
      tr.cells[2].innerHTML   = statusBadge(inc.status);
      tr.cells[3].textContent = inc.detector || '—';
      tr.cells[4].innerHTML   = riskBadge(inc.risk_score, inc.status);
      tr.cells[5].textContent = inc.context_summary || '';
      tr.style.display = rowVisible(inc) ? '' : 'none';
    } else {
      tr = buildRow(inc);
      // Insert in timestamp-descending order
      const ts = inc.timestamp || '';
      let inserted = false;
      const rows = tbody.querySelectorAll('tr');
      for (const existing of rows) {
        const eid = existing.dataset.id;
        const existingInc = store.get(eid);
        if (existingInc && (existingInc.timestamp || '') < ts) {
          tbody.insertBefore(tr, existing);
          inserted = true;
          break;
        }
      }
      if (!inserted) tbody.appendChild(tr);
    }
    // Flash animation
    tr.classList.remove('flash');
    // Force reflow to restart animation
    void tr.offsetWidth;
    tr.classList.add('flash');
    return tr;
  }

  function reapplyFilter() {
    for (const tr of tbody.querySelectorAll('tr')) {
      const inc = store.get(tr.dataset.id);
      if (inc) tr.style.display = rowVisible(inc) ? '' : 'none';
    }
  }

  function updateCounters() {
    let blocked = 0, pending = 0;
    for (const inc of store.values()) {
      if (inc.status === 'blocked') blocked++;
      else if (inc.status === 'pending_approval' || inc.status === 'pending') pending++;
    }
    cntBlocked.textContent = blocked;
    cntPending.textContent = pending;
    cntTotal.textContent   = store.size;
  }

  function toggleEmpty() {
    const hasRows = store.size > 0;
    table.style.display = hasRows ? '' : 'none';
    empty.style.display = hasRows ? 'none' : '';
  }

  function applyIncident(inc) {
    if (!inc || !inc.id) return;
    store.set(inc.id, inc);
    updateRow(inc);
    updateCounters();
    toggleEmpty();
  }

  function applySnapshot(incidents) {
    // Full replace: rebuild table from scratch, newest first
    store.clear();
    tbody.innerHTML = '';
    const sorted = (incidents || []).slice().sort(
      (a, b) => (b.timestamp || '') < (a.timestamp || '') ? -1 : 1
    );
    for (const inc of sorted) {
      if (!inc || !inc.id) continue;
      store.set(inc.id, inc);
      tbody.appendChild(buildRow(inc));
    }
    updateCounters();
    toggleEmpty();
  }

  // ── Initial fetch ────────────────────────────────────────────────────────

  fetch('/incidents?limit=50')
    .then(r => r.json())
    .then(data => {
      applySnapshot(data.incidents || []);
    })
    .catch(() => {
      toggleEmpty();
    });

  // ── SSE stream ───────────────────────────────────────────────────────────

  function connectStream() {
    const es = new EventSource('/incidents/stream');

    es.addEventListener('snapshot', function (e) {
      try {
        const data = JSON.parse(e.data);
        applySnapshot(data.incidents || []);
      } catch (_) {}
    });

    es.addEventListener('upsert', function (e) {
      try {
        const inc = JSON.parse(e.data);
        applyIncident(inc);
      } catch (_) {}
    });

    es.addEventListener('mcp_status', function () {
      // MCP unreachable — keep showing existing rows, just dim the dot
      dot.className = 'error';
      dot.title = 'MCP server unreachable';
    });

    es.onopen = function () {
      dot.className = 'live';
      dot.title = 'Live stream connected';
    };

    es.onerror = function () {
      dot.className = 'error';
      dot.title = 'Live stream error — reconnecting…';
      es.close();
      setTimeout(connectStream, 4000);
    };
  }

  connectStream();

  // ── Filter buttons ───────────────────────────────────────────────────────

  document.getElementById('controls').addEventListener('click', function (e) {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    reapplyFilter();
  });

})();
</script>
</body>
</html>
